project:
  type: website
  resources:
    - assets/*

lang: de-CH

website:
  title: Kritische KI-Nutzung
  description: 'Workshop der AG Interne Weiterbildung, Universität Bern — 14. Oktober 2026'
  favicon: favicon.ico
  open-graph: true
  site-url: https://dhbern.github.io/kritische-ki-nutzung/
  repo-url: https://github.com/DHBern/kritische-ki-nutzung/
  issue-url: https://github.com/DHBern/kritische-ki-nutzung/issues/new/choose
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: false
  back-to-top-navigation: true

  navbar:
    logo: logo.png
    logo-alt: 'Digital Humanities, Universität Bern'
    logo-href: 'https://www.dh.unibe.ch/'
    search: true
    tools:
      - icon: github
        url: https://github.com/DHBern/kritische-ki-nutzung/
    left:
      - href: index.qmd
        text: Workshop
      - href: contents/programm.qmd
        text: Programm
      - href: contents/werkzeuge.qmd
        text: Werkzeuge
      - href: contents/aufgaben.qmd
        text: Aufgaben
      - href: contents/agenten.qmd
        text: Bots & Agenten
      - href: contents/reflexion.qmd
        text: Reflexion
      - href: contents/folien.qmd
        text: Folien

format:
  html:
    link-external-icon: true
    link-external-newwindow: true
    toc: true
    toc-title: Auf dieser Seite
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    css: styles.css
    page-layout: full
    include-in-header:
      text: |
        <meta name="robots" content="noindex">

freeze: true

editor: visual
